version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: paperclip-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
